<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultPDF Studio — Local PDF Utility Studio</title>
  <link rel="stylesheet" href="/static/css/brutalist.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="badge">100% OFFLINE • ZERO UPLOADS • AUTO-WIPED TEMP FILES</div>
      <h1>VaultPDF Studio</h1>
      <p class="subtitle">A privacy-first, local PDF toolkit. Files are processed in temporary workspaces and automatically deleted after each download.</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Select a Tool</h2>
      <div class="tool-grid" id="tool-grid">
        <button class="tool-card active" data-tool="merge" data-color="yellow">
          <span class="tool-title">Merge</span>
          <span class="tool-desc">Combine multiple PDFs in your chosen order.</span>
        </button>
        <button class="tool-card" data-tool="split" data-color="mint">
          <span class="tool-title">Split</span>
          <span class="tool-desc">Extract page ranges into a ZIP of PDFs.</span>
        </button>
        <button class="tool-card" data-tool="compress" data-color="coral">
