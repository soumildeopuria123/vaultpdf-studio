<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultPDF Studio — Local PDF Utility Studio</title>
  <link rel="stylesheet" href="/static/css/brutalist.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="badge">100% OFFLINE • ZERO UPLOADS • AUTO-WIPED TEMP FILES</div>
      <h1>VaultPDF Studio</h1>
      <p class="subtitle">A privacy-first, local PDF toolkit. Files are processed in temporary workspaces and automatically deleted after each download.</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Select a Tool</h2>
      <div class="tool-grid" id="tool-grid">
        <button class="tool-card active" data-tool="merge" data-color="yellow">
          <span class="tool-title">Merge</span>
          <span class="tool-desc">Combine multiple PDFs in your chosen order.</span>
        </button>
        <button class="tool-card" data-tool="split" data-color="mint">
          <span class="tool-title">Split</span>
          <span class="tool-desc">Extract page ranges into a ZIP of PDFs.</span>
        </button>
        <button class="tool-card" data-tool="compress" data-color="coral">
          <span class="tool-title">Compress to Target KB</span>
          <span class="tool-desc">Iteratively downscale to hit a size goal.</span>
        </button>
        <button class="tool-card" data-tool="redact" data-color="sky">
          <span class="tool-title">True Redact</span>
          <span class="tool-desc">Permanently remove text &amp; image data.</span>
        </button>
        <button class="tool-card" data-tool="convert-pdf-word" data-color="yellow">
          <span class="tool-title">PDF ↔ Word</span>
          <span class="tool-desc">PDF to DOCX and DOCX to PDF (Windows).</span>
        </button>
        <button class="tool-card" data-tool="convert-pdf-images" data-color="mint">
          <span class="tool-title">PDF ↔ Images</span>
          <span class="tool-desc">Export pages or bundle images into PDF.</span>
        </button>
        <button class="tool-card" data-tool="protect-unlock" data-color="coral">
          <span class="tool-title">Protect / Unlock</span>
          <span class="tool-desc">AES-256 encrypt or decrypt PDFs.</span>
        </button>
        <button class="tool-card" data-tool="rotate-watermark" data-color="sky">
          <span class="tool-title">Rotate &amp; Watermark</span>
          <span class="tool-desc">Rotate pages or add diagonal watermark.</span>
        </button>
      </div>
    </section>

    <section class="panel" id="workspace">
      <div class="workspace-header">
        <div>
          <h2 id="tool-heading">Merge PDFs</h2>
