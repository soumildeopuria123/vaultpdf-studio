services:
  app:
    build: .
    container_name: vaultpdf-app
    restart: unless-stopped
    environment:
      - PORT=8000
    expose:
      - "8000"
    # No volumes needed; .temp_workspace is ephemeral per-request scratch space inside the container.

  caddy:
    image: caddy:2-alpine
    container_name: vaultpdf-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
